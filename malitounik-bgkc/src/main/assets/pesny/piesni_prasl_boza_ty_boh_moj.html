 <br>
Божа – Ты Бог мой, <br>
Цябе шукаю пільна, <br>
Цябе душа мая прагне.<br>
<br>
Божа, пачуй мае<br>
Ўпрашаньні і малітву<br>
І дай душы маёй спакой.<br>
<br>
Тады душа мая<br>
Насыціцца любоўю, <br>
Адродзіцца ў ёй жыцьцё.<br>
<br>
Божа – Ты Бог мой, <br>
Цябе шукаю пільна, <br>
Цябе душа мая прагне.<br>
